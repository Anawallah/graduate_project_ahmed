<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graduate 2026</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap");

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #050505;
        overflow: hidden;
        font-family: "Space Grotesk", "Segoe UI", Tahoma, sans-serif;
      }

      img {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        display: block;
        background: #050505;
      }

      #orientationToast {
        position: fixed;
        left: 50%;
        bottom: 6vh;
        transform: translate(-50%, 16px);
        padding: 12px 18px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.78);
        color: #f3f3f3;
        font-size: 0.9rem;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      #orientationToast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (prefers-reduced-motion: reduce) {
        #orientationToast {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <img src="Graduate_2026.JPG" alt="Graduate 2026 card" />
    <div id="orientationToast">Tip: Rotate your phone to horizontal for a clearer view.</div>

    <script>
      const toast = document.getElementById("orientationToast");
      let toastTimer;

      const maybeShowToast = () => {
        const isPhone =
          window.matchMedia("(max-width: 900px)").matches ||
          window.matchMedia("(pointer: coarse)").matches;
        const isPortrait = window.innerHeight > window.innerWidth;

        if (isPhone && isPortrait) {
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 3500);
        } else {
          toast.classList.remove("show");
        }
      };

      window.addEventListener("load", maybeShowToast);
      window.addEventListener("resize", maybeShowToast);
    </script>
  </body>
</html>
